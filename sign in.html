<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sign in</title>
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
      <a href="#home">Home</a> | 
      <a href="#about">About Us</a> | 
      <a href="#signin">Sign In</a> | 
      <a href="#menu">Menu</a> | 
      <a href="#order">Order Online</a> | 
      <a href="#contact">Contact Us</a>
    </nav>
    <section id="signin">
      <h2>Sign In</h2>
      <form action="#" method="post">
        <label for="signin-email">Email:</label>
        <input type="text" id="signin-email" name="email"><br>
        
        <label for="signin-password">Password:</label>
        <input type="password" id="signin-password" name="password"><br><br>
        
        <input type="submit" value="Sign In">
      </form>

      <h2>Register</h2>
      <form action="#" method="post">
        <label for="reg-name">Name:</label>
        <input type="text" id="reg-name" name="name"><br>
        
        <label for="reg-surname">Surname:</label>
        <input type="text" id="reg-surname" name="surname"><br>
        
        <label for="reg-email">Email:</label>
        <input type="text" id="reg-email" name="email"><br>
        
        <label for="reg-password">Password:</label>
        <input type="password" id="reg-password" name="password"><br><br>
        
        <input type="submit" value="Register">
      </form>

      <h3>Verification</h3>
      <label>
        <input type="checkbox" name="verify"> I verify my identity
      </label>
    </section>
</body>
</html>
